# Deploys the built app to GitHub Pages.
#
# Pages hosts the static frontend; the Cloudflare Worker handles live sync.
#
# Deploying from a branch rather than a workflow keeps the build reproducible
# and inspectable, and Pages serves the repository subpath directly, which is
# why `base` is set to './' in vite.config.ts.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one rather
# than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck and unit tests run before the build so a broken commit never
      # reaches Pages.
      - run: npm test
      # A share link is only short because the worker keeps the room, so a
      # broken room object must not ship.
      - run: node cloudflare/check-room.mjs
      - run: npm run build
        env:
          VITE_SYNC_URL: wss://erd-sync.cerberus-tusk-proxy.workers.dev

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
